name: Build HYDRA AIM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        shell: bash
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Nenhum arquivo ZIP encontrado!"
            exit 1
          fi

          echo "Extraindo: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find source -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Projeto Android não encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew não encontrado, gerando wrapper..."
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
          chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload HYDRA AIM APK
        uses: actions/upload-artifact@v4
        with:
          name: HYDRA-AIM-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
