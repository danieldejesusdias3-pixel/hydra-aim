name: Build HYDRA AIM APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip -q *.zip -d source
          cd "$(dirname "$(find source -name settings.gradle -print -quit)")"
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HYDRA-AIM-APK
          path: source/hydra-aim/app/build/outputs/apk/debug/app-debug.apk
