name: Build HYDRA AIM APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Extrair projeto
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d source

      - name: Localizar projeto Android
        run: |
          PROJECT_DIR=$(dirname "$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verificar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado: $APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: HYDRA-AIM-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
