name: Build HYDRA AIM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Extract project
        run: |
          mkdir -p source
          shopt -s nullglob
          files=( *.zip )

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo ZIP encontrado!"
            exit 1
          fi

          unzip -q "${files[0]}" -d source

      - name: Locate Android project
        run: |
          PROJECT_FILE=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Projeto Gradle não encontrado!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build HYDRA AIM
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload HYDRA AIM APK
        uses: actions/upload-artifact@v4
        with:
          name: HYDRA-AIM-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
